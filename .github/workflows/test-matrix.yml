#
# Multi-distro integration test matrix on the self-hosted runner.
# Thin caller: the jobs live in terok-util's reusable
# fleet-test-matrix.yml; the slot list is derived from this repo's
# tests/containers/matrix.yml via `terok-matrix --slots-json`.
name: Test Matrix

on:
  workflow_dispatch:
    inputs:
      slots:
        description: Space-separated slot subset (default = all declared)
        required: false
        default: ""
      krun:
        description: Run the whole matrix with krun (requires a capable runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    uses: sliwowitz/terok-util/.github/workflows/fleet-test-matrix.yml@8fb943b116474bda63c284163ed93c75a8c4f133
    with:
      slots: ${{ inputs.slots }}
      krun: ${{ inputs.krun }}
